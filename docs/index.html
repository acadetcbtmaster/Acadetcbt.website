    <!-- Immediate Theme Initialization to Prevent Theme Flash / Drift -->
    <style>
      html, body {
        background-color: #f4f5f7;
        color: #111827;
      }
      html.dark, html.dark body, html.dark-theme, html.dark-theme body {
        background-color: #0f1115 !important;
        color: #f3f4f6 !important;
      }
    </style>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('cbt_theme_mode');
          var isDark = saved === 'dark';
          var docEl = document.documentElement;
          if (isDark) {
            docEl.classList.remove('light-theme');
            docEl.classList.add('dark-theme', 'dark');
            docEl.setAttribute('data-theme', 'dark');
            docEl.style.colorScheme = 'dark';
            docEl.style.backgroundColor = '#0f1115';
          } else {
            docEl.classList.remove('dark-theme', 'dark');
            docEl.classList.add('light-theme');
            docEl.setAttribute('data-theme', 'light');
            docEl.style.colorScheme = 'light';
            docEl.style.backgroundColor = '#f4f5f7';
          }
        } catch (e) {}
      })();
    </script>

    <!-- GitHub Pages SPA Route Restoration (runs safely on github.io only) -->
    <script>
      (function(l) {
        try {
          if (l.hostname.indexOf('github.io') > -1 && l.search && l.search[1] === '/') {
            var decoded = l.search.slice(1).split('&').map(function(s) { 
              return s.replace(/~and~/g, '&');
            }).join('?');
            var base = l.pathname.slice(0, -1) || '';
            window.history.replaceState(null, null, base + decoded + l.hash);
          }
        } catch (e) {}
      }(window.location));
    </script>
