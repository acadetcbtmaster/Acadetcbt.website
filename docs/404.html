<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found (404) | Acadet CBT</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <style>
      body {
        margin: 0;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #eef3fb;
        color: #082252;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 520px;
        width: 100%;
        background: #ffffff;
        border: 1px solid #dce6f5;
        border-radius: 16px;
        padding: 32px;
        text-align: center;
        box-shadow: 0 8px 24px rgba(11, 51, 122, 0.08);
      }
      .code {
        display: inline-block;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.08em;
        color: #0a58ed;
        background: #eff5ff;
        padding: 6px 12px;
        border-radius: 8px;
        margin-bottom: 12px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 24px;
        font-weight: 800;
      }
      p {
        margin: 0 0 24px;
        font-size: 14px;
        line-height: 1.6;
        color: #475569;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
      }
      a {
        text-decoration: none;
        font-size: 13px;
        font-weight: 700;
        padding: 10px 16px;
        border-radius: 10px;
      }
      .primary {
        background: #0a58ed;
        color: #ffffff;
      }
      .secondary {
        background: #f1f5f9;
        color: #0b337a;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="code">ERROR 404</div>
      <h1>Page Not Found</h1>
      <p>
        The page you requested on Acadet CBT does not exist or may have moved. Use the links below to browse available courses or return to the homepage.
      </p>
      <div class="links">
        <a class="primary" href="/">Go to Homepage</a>
        <a class="secondary" href="/courses">Browse Courses</a>
        <a class="secondary" href="/faq">FAQ</a>
        <a class="secondary" href="/contact">Contact Support</a>
      </div>
    </main>
  </body>
</html>
