<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acadet CBT MASTER</title>
    <script>
      // Single Page App redirect for GitHub Pages hosting
      // Converts deep links (e.g. /founder or /practice) to query parameters
      // so index.html can restore the route seamlessly without 404 errors.
      (function() {
        var l = window.location;
        // Keep 1 path segment if on github.io subpath (e.g. /repo-name/), 0 if on custom domain
        var isGithubIo = l.hostname.indexOf('github.io') > -1;
        var pathSegmentsToKeep = isGithubIo ? 1 : 0;
        
        var pathParts = l.pathname.slice(1).split('/');
        var repoSegment = isGithubIo ? pathParts.slice(0, pathSegmentsToKeep).join('/') : '';
        var routePath = pathParts.slice(pathSegmentsToKeep).join('/');
        
        var targetUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          (repoSegment ? '/' + repoSegment : '') +
          '/?/' + routePath.replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash;
          
        l.replace(targetUrl);
      })();
    </script>
  </head>
  <body style="background-color: #0f1115; color: #ffffff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p style="font-size: 1.1rem; opacity: 0.8;">Loading Acadet CBT MASTER...</p>
  </body>
</html>
