name: CI Quality & Build Verification

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  verify:
    name: Lint & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Run TypeScript Lint & Type Check
        run: npm run lint

      - name: Verify Full-Stack Server & Client Build
        run: npm run build
